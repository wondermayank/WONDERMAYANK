name: Update live status board

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/status.py", "scripts/theme.py"]

permissions:
  contents: write

concurrency:
  group: profile-updates
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sites and push
        run: >
          bash scripts/ci_push.sh
          "chore: refresh live status board"
          "assets/auto/status-light.svg assets/auto/status-dark.svg"
          "python scripts/status.py"
