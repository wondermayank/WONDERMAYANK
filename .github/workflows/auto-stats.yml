name: Update stats cards and recent projects

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats.py", "scripts/projects.py", "scripts/theme.py"]

permissions:
  contents: write

concurrency:
  group: profile-updates
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cards and push
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          bash scripts/ci_push.sh
          "chore: refresh stats cards and recent projects"
          "README.md assets/auto/stats-light.svg assets/auto/stats-dark.svg assets/auto/langs-light.svg assets/auto/langs-dark.svg assets/auto/proj-1-light.svg assets/auto/proj-1-dark.svg assets/auto/proj-2-light.svg assets/auto/proj-2-dark.svg assets/auto/proj-3-light.svg assets/auto/proj-3-dark.svg assets/auto/proj-4-light.svg assets/auto/proj-4-dark.svg"
          "python scripts/stats.py && python scripts/projects.py"
